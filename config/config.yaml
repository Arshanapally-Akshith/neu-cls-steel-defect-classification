# NEU-CLS Steel Defect Classification — project configuration
# Phase 1 (data prep), Phase 2 (classical baseline), Phase 3 (ResNet18
# transfer learning), Phase 4 (error analysis), Phase 5 (Grad-CAM) and
# Phase 6 (Streamlit demo) settings all live here.

seed: 42

dataset:
  # NEU-CLS.zip contains image files alongside object-detection annotations
  # (YOLO-format bbox .txt labels). This project uses only the images, for
  # 6-class whole-image classification, and intentionally ignores the
  # detection labels — they are never read anywhere in this pipeline.
  zip_path: NEU-CLS.zip
  raw_dir: data/raw/NEU-CLS
  # Canonical class slugs, derived from the filename prefixes inside the zip.
  classes:
    - crazing
    - inclusion
    - patches
    - pitted_surface
    - rolled-in_scale
    - scratches
  images_per_class: 300
  total_images: 1800
  # NOTE: raw data is exactly balanced (300/class, 1800 total), but contains
  # one exact-duplicate pair (patches_101.jpg == patches_105.jpg, confirmed
  # via SHA-256). That pair is resolved by dropping one copy *before*
  # splitting (see src/data/dedup.py) so splits are built from 1799 unique
  # images (patches: 299). See reports/data_integrity.md for details.
  expected_size: [200, 200]   # [width, height]
  expected_mode: RGB
  valid_extensions: [.jpg]

split:
  train: 0.70
  val: 0.15
  test: 0.15
  output_dir: data/splits

# Phase 2 — classical baseline: HOG features + Logistic Regression.
# Loads images ONLY through data/splits/{train,val,test}.csv (the frozen
# Phase 1 manifests). Preprocessing (HOG is stateless, but the feature
# scaler) and the classifier are fit on train only; val is used purely for
# hyperparameter (C) selection; test is touched exactly once, for final
# reporting.
baseline:
  grayscale: true   # images are RGB-encoded JPEGs of grayscale content (see data_integrity.md)
  hog:
    orientations: 9
    pixels_per_cell: [16, 16]
    cells_per_block: [2, 2]
    block_norm: L2-Hys
  logistic_regression:
    C_grid: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
    max_iter: 5000
    solver: lbfgs
  selection_metric: f1_macro   # metric used to pick the best C on the val set
  random_state: 42
  output:
    model_path: models/baseline.joblib
    results_dir: reports

# Phase 3 — ResNet18 transfer learning (ImageNet-pretrained backbone,
# frozen, with a fine-tuned linear classification head).
#
# "Development data" (dev) = train + val manifests pooled together. The
# frozen test manifest is loaded only once, at the very end, for final
# reporting — never during k-fold CV or model selection.
#
# Model selection: k-fold CV on dev picks the number of training epochs
# (the epoch with the best mean val f1_macro across folds, tracked
# per-fold); the final model is then retrained from scratch on the FULL
# dev set for that many epochs and evaluated once on test.
transfer_learning:
  backbone: resnet18
  pretrained: true
  freeze_backbone: true   # only the replaced final FC layer is trained
  input_size: [224, 224]  # standard ImageNet input size for this backbone
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  augmentation:
    # Defects are texture/pattern-based, not orientation-dependent, so
    # rotation/flip/slight crop are safe. No color jitter — images are
    # grayscale content (RGB-encoded), so color augmentation is meaningless
    # (see reports/data_integrity.md).
    random_rotation_degrees: 15
    horizontal_flip: true
    vertical_flip: true
    random_resized_crop_scale: [0.85, 1.0]
  training:
    batch_size: 32
    max_epochs: 6          # per CV fold; final model retrains for the selected epoch count
    learning_rate: 0.001
    weight_decay: 0.0001
    optimizer: adam
    num_workers: 0          # deterministic, avoids Windows multiprocessing overhead for this dataset size
  cv:
    n_splits: 5
    seed: 42
    selection_metric: f1_macro   # metric used to pick the best epoch, per fold and on average
  seed: 42
  output:
    model_path: models/resnet18_finetuned.pt
    results_dir: reports

# Phase 4 — error analysis on the already-trained, already-evaluated Phase 2
# and Phase 3 models. Re-runs inference (not training) for both models on
# the frozen test manifest to get PER-SAMPLE predictions/confidences, which
# Phase 2/3 never persisted (only aggregate metrics). Neither model, the
# split, nor the test data are modified by this phase.
error_analysis:
  top_n_confusion_pairs: 5
  max_misclassified_grid_images: 9
  output:
    predictions_csv: reports/error_analysis_predictions.csv
    results_dir: reports

# Phase 5 — Grad-CAM verification on the already-trained Phase 3 model.
# Pure inference + backward-for-gradients on the frozen test manifest, using
# the Phase 4 per-sample predictions CSV to select WHICH images to explain
# (never re-derives correctness or re-runs training). Neither the model nor
# the split are modified.
gradcam:
  target_layer: layer4.-1   # last BasicBlock of ResNet18's final conv stage
  overlay_alpha: 0.45
  # Classes flagged in Phase 4 as confusion-prone (from top_confusion_pairs)
  # plus the historic patches/crazing pair, get extra correctly-classified
  # examples beyond the one-per-class default set, to see whether attention
  # is consistent even on a class's "easy" correct predictions.
  confusion_prone_classes: [inclusion, pitted_surface, scratches, patches, crazing]
  n_extra_correct_per_confusion_class: 1   # additional LOWEST-confidence correct example per class
  output:
    predictions_csv: reports/error_analysis_predictions.csv   # input: Phase 4's per-sample table
    heatmaps_dir: reports/gradcam
    results_dir: reports

# Phase 6 — Streamlit demo. Pure UI layer over the already-trained Phase 3
# model and the Phase 5 Grad-CAM utilities — reuses src.models.transfer and
# src.gradcam.gradcam directly rather than reimplementing any prediction or
# explanation logic. Never trains or modifies the model/split.
streamlit:
  title: "NEU-CLS Steel Surface Defect Classifier"
  page_icon: "🔍"
  allowed_upload_types: [jpg, jpeg, png, bmp]
  # Phase 4's dominant ResNet18 confusion group (inclusion <-> pitted_surface
  # / scratches — see reports/error_analysis.md "Most Important Confusion
  # Pairs"). A caution note is shown whenever the predicted class is one of
  # these three.
  confusion_note:
    classes: [inclusion, pitted_surface, scratches]
    text: >-
      Heads up: Phase 4's error analysis found this model's most common
      mistakes are mixing up **inclusion**, **pitted_surface**, and
      **scratches** with each other (e.g. inclusion predicted as
      pitted_surface in 4 of 45 test images). This prediction falls in that
      group — worth a second look, especially if the confidence above isn't
      high.
  model_limitations: >-
    - Backbone is a **frozen, ImageNet-pretrained ResNet18** — only the
    final classification layer was trained (a linear probe), not the
    convolutional features themselves (see Phase 3).

    - Trained and evaluated on the **NEU-CLS dataset only**: 1,799 unique
    200x200 grayscale images from one imaging setup. Performance on a
    different steel mill's camera, lighting, or surface finish is untested
    and may be substantially worse (domain shift).

    - Test-set accuracy is **96.3%** (Phase 3/4), but errors concentrate in
    the confusion group noted above — treat predictions in that group with
    more caution than the headline accuracy alone suggests.

    - The Grad-CAM overlay shows where the model's prediction is locally
    *gradient-sensitive*, not a proof of causal reasoning. Phase 5 found
    this generally aligns with visible defect texture, but flagged the
    **crazing** class specifically as showing a possible edge/corner
    attention pattern (based on only 3 examples — a hypothesis, not a
    confirmed finding).
  output:
    model_path: models/resnet18_finetuned.pt   # documents the checkpoint this app expects; loaded via transfer_learning.output.model_path

paths:
  reports_dir: reports
  models_dir: models
